# Parámetros normativos y supuestos del simulador.
# Cada parámetro tiene: valor, fuente y estado (verificado | por_verificar | pendiente).
# Fecha de corte de la revisión: 2026-10-09. Detalle en docs/marco_normativo.md.

fecha_corte: 2026-10-09

smmlv:
  valores:            # pesos corrientes
    2025: 1423500
    2026: 1750905
  fuente: "Decreto 1469 de 2025; Decreto 0159 de 2026"
  estado: por_verificar

auxilio_transporte:            # no hace parte del IBC; se usa para identificar a quienes ganan el mínimo en la GEIH
  valores:
    2022: 117172
    2023: 140606
    2024: 162000
    2025: 200000
    2026: 249095
  fuente: "Decretos anuales del auxilio de transporte (2026: Decreto 1470 de 2025)"
  estado: por_verificar

cotizacion:
  tasa_total: 0.16
  reparto_rais:
    cuenta_individual: 0.115
    fgpm: 0.015
    administracion_y_seguro: 0.03
  fuente: "Ley 100 de 1993 art. 20; Superfinanciera concepto 2021-0126207"
  estado: verificado
  ibc_min_smmlv: 1
  ibc_max_smmlv: 25
  ibc_independientes_pct_ingreso: 0.40
  estado_topes: por_verificar

fondo_solidaridad_pensional:   # aporte adicional al 16 %, no entra a la cuenta individual
  tramos:                      # [IBC desde (en SMMLV), tasa total FSP]
    - [4, 0.010]
    - [16, 0.012]
    - [17, 0.014]
    - [18, 0.016]
    - [19, 0.018]
    - [20, 0.020]
  fuente: "Ley 100 de 1993 art. 27, modificado por Ley 797 de 2003 art. 8"
  estado: por_verificar

rais:
  # Art. 64: capital para una pensión > 110 % del SMMLV de 1993 reajustado por IPC (umbral muy por
  # debajo del SMMLV actual). Como ninguna pensión puede ser menor a 1 SMMLV (art. 35), la AFP
  # verifica si el saldo financia una pensión vitalicia de 1 SMMLV (Saldo de Pensión Mínima,
  # Res. MinHacienda 3099 de 2015, modificada por la 3023 de 2017).
  capital_suficiente: "pension_minima_vitalicia"
  fuente_capital: "Ley 100 de 1993 arts. 35 y 64; Res. MinHacienda 3099 de 2015"
  estado_capital: verificado
  garantia_pension_minima:
    edad: {hombre: 62, mujer: 57}
    semanas_hombre: 1150
    semanas_mujer:             # C-054 de 2024: 1150 hasta 2025; -15 por año desde 2026 hasta 1000
      hasta_2025: 1150
      anio_base: 2026
      valor_base: 1135
      reduccion_anual: 15
      minimo: 1000
    fuente: "Ley 100 de 1993 art. 65; Sentencia C-054 de 2024"
    estado: por_verificar      # calendario derivado de la regla de la sentencia
  mesadas_por_anio: 13         # Acto Legislativo 01 de 2005

rpm:
  edad: {hombre: 62, mujer: 57}
  semanas_hombre: 1300
  semanas_mujer:               # C-197 de 2023: -50 en 2026 y -25 por año desde 2027 hasta 1000 (2036)
    hasta_2025: 1300
    anio_base: 2026
    valor_base: 1250
    reduccion_anual: 25
    minimo: 1000
  semanas_ibl_toda_la_vida: 1250  # art. 21: IBL de toda la vida si es mayor y hay >= 1250 semanas
  indemnizacion_pct: 0.13      # art. 37: promedio ponderado de % de cotización (vejez); por verificar
  ibl_anios: 10
  tasa_reemplazo:              # r = base - pendiente * (IBL/SMMLV), en %
    base: 65.50
    pendiente: 0.50
    piso: 55.0
    techo: 65.0
    incremento_por_50_semanas: 1.5
    maximo_piso: 70.5
    maximo_techo: 80.0
  pension_min_smmlv: 1
  pension_max_smmlv: 25
  fuente: "Ley 100 de 1993 arts. 21, 33, 34, 35 y 37 (texto compilado, Secretaría del Senado); Sentencia C-197 de 2023"
  estado: verificado           # salvo indemnizacion_pct

reforma_2381:
  vigencia_desde: 2027-04-01
  umbral_prima_media_smmlv: 2.3
  tope_ahorro_individual_smmlv: 25
  transicion_semanas: {hombre: 900, mujer: 750}
  fuente: "Ley 2381 de 2024; Sentencia C-264 de 2026; cartilla MinSalud"
  estado: pendiente            # transición devuelta a la Cámara; fórmula de liquidación sin revisar

mortalidad:
  tabla: RV08
  fuente: "Superfinanciera, Resolución 1555 de 2010"
  estado: por_verificar        # confirmar que no haya sido reemplazada

multifondos:
  fondos: [mayor_riesgo, moderado, conservador, retiro_programado]
  # Escalones [edad desde, proporción]: el valor rige desde esa edad hasta el siguiente escalón.
  # Afiliados que no eligen fondo: % de aportes y saldo en mayor riesgo; el resto va al moderado.
  mayor_riesgo_por_defecto:
    mujer:  [[0, 1.0], [42, 0.8], [43, 0.6], [44, 0.4], [45, 0.2], [46, 0.0]]
    hombre: [[0, 1.0], [47, 0.8], [48, 0.6], [49, 0.4], [50, 0.2], [51, 0.0]]
  fuente_por_defecto: "Decreto 2555 de 2010 art. 2.6.11.1.5, modificado por el Decreto 959 de 2018"
  # Saldo mínimo en el conservador (convergencia); el resto queda en el moderado.
  # Tabla original 50-54 (mujeres) y 55-59 (hombres) + 2 años desde 2014 (parágrafo 2).
  conservador_minimo:
    mujer:  [[0, 0.0], [52, 0.2], [53, 0.4], [54, 0.6], [55, 0.8], [56, 1.0]]
    hombre: [[0, 0.0], [57, 0.2], [58, 0.4], [59, 0.6], [60, 0.8], [61, 1.0]]
  fuente_convergencia: "Decreto 2555 de 2010 art. 2.6.11.1.6 y parágrafo 2 (texto compilado, Cancillería)"
  estado: verificado

supuestos:                     # valores anuales; sujetos a análisis de sensibilidad
  inflacion: 0.03
  crecimiento_real_smmlv: 0.01
  crecimiento_real_productividad: 0.01
  tasa_tecnica_real: 0.04
  semanas_por_mes: 4.2857

rentabilidades:                # opciones por defecto del modelo de rentabilidades (paso 3)
  afp: Protección
  metodo: bootstrap            # bootstrap | t | determinista
  largo_bloque: null           # null = óptimo de Politis-White (~1,4 meses con los datos actuales)
  incertidumbre_media: false   # true en el análisis de sensibilidad
  media_objetivo: null         # p. ej. {moderado: 0.035}; null = media histórica
  calibracion:                 # Protección, feb-2016 a sep-2026 (notebooks/02_rentabilidades.ipynb)
    nu_t_multivariada: 4
    media_real_anual: {mayor_riesgo: 0.0410, moderado: 0.0371, conservador: 0.0233, retiro_programado: 0.0282}
    error_estandar_media: {mayor_riesgo: 0.0271, moderado: 0.0206, conservador: 0.0180, retiro_programado: 0.0193}

salarios:                      # modelo salarial (paso 4); estimación completa en data/processed/modelo_salarial.json
  muestra: "cotizantes GEIH 2022-2025 de 18 a 65 años con ingreso laboral"
  censura: "ingreso <= mínimo + auxilio de transporte + 2 % del mínimo"
  observaciones: 583208
  proporcion_censurada: 0.412
  persistencia:                # tipo: [σα permanente, σε choque anual, ρ]
    "Primaria o menos|Hombre": [0.374, 0.080, 0.993]
    "Primaria o menos|Mujer": [0.257, 0.075, 0.995]
    "Secundaria|Hombre": [0.408, 0.066, 0.995]
    "Secundaria|Mujer": [0.094, 0.120, 0.974]
    "Media|Hombre": [0.396, 0.107, 0.975]
    "Media|Mujer": [0.433, 0.073, 0.995]
    "Superior|Hombre": [0.407, 0.193, 0.968]
    "Superior|Mujer": [0.235, 0.243, 0.945]

densidad_cotizacion:           # modelo de cotización (paso 5); detalle en data/processed/modelo_cotizacion.json
  tasas: "GEIH 2023-2025, proporción de la población que cotiza por educación × sexo × edad (logit con spline)"
  parametros: {mu0: 0.3000, kappa: 0.5800, beta: 6.1900, rho_eta: 0.7000, edad_fija_eta: 30}
  objetivos:
    cotizantes_sobre_activos: {dato: 0.82, modelo: 0.819, fuente: "MinTrabajo, datos.gov.co sk9s-yxmi (columnas de las AFP invertidas)", estado: por_verificar}
    periodo_3_anios_25_44: {dato: 0.463, modelo: 0.461, fuente: "GEIH P6426, cotizantes con >= 36 meses en el empleo"}
    periodo_3_anios_45_64: {dato: 0.726, modelo: 0.728, fuente: "GEIH P6426, cotizantes con >= 36 meses en el empleo"}
    alguna_vez_cotizo: {dato: 0.77, modelo: 0.775, fuente: "afiliados MinTrabajo / población GEIH 18-70 (cota superior)"}
  edad_consolidacion: "estimada en una rejilla de 25 a 40 años; mejor ajuste entre 28 y 32 (se usa 30)"
