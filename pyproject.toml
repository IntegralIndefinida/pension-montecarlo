[project]
name = "pension-mc"
version = "0.1.0"
description = "Simulador Monte Carlo de pensiones en Colombia"
requires-python = ">=3.11"
# Lo necesario para ejecutar el motor con los modelos de artefactos/
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "statsmodels>=0.14", "pyyaml>=6", "pyarrow>=14"]

[project.optional-dependencies]
# Pipeline de datos y reestimación (descargas, GEIH vía dane-data; requiere pdftotext)
datos = ["requests>=2.31", "openpyxl>=3.1", "dane-data @ git+https://github.com/IntegralIndefinida/DANE-data"]
notebooks = ["matplotlib>=3.8", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6"]
app = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=8", "requests>=2.31"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
